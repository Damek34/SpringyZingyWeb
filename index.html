<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08091b">
    <title>Springy Zingy</title>
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Telegram Mini App SDK: keep this before other scripts. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK temporarily omitted for startup diagnostics. -->
</head>
<body>
    <!-- Animowane geometryczne tło widoczne podczas ładowania gry. -->
    <canvas id="network-bg" aria-hidden="true"></canvas>

    <!-- Unity przejmuje cały ekran po zakończeniu inicjalizacji. -->
    <main id="unity-container" aria-label="Springy Zingy game">
        <canvas id="unity-canvas" tabindex="-1" aria-label="Springy Zingy"></canvas>
    </main>

    <!-- Własny splash/loading screen zamiast domyślnego brandingu Unity. -->
    <section id="loading-screen" aria-live="polite" aria-label="Ładowanie gry">
        <div class="loader-shell">
            <div class="topline"><span class="topline-dot"></span> ENDLESS RUNNER <span class="topline-separator">/</span> WEB VERSION</div>

            <div class="brand-emblem" aria-hidden="true">
                <svg viewBox="0 0 100 100" role="presentation">
                    <defs>
                        <linearGradient id="emblemGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#69e8ff"/>
                            <stop offset="53%" stop-color="#9c66ff"/>
                            <stop offset="100%" stop-color="#ff4fc8"/>
                        </linearGradient>
                        <filter id="emblemGlow" x="-70%" y="-70%" width="240%" height="240%">
                            <feGaussianBlur stdDeviation="3.5" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <path d="M50 6 L88 28 L88 71 L50 94 L12 71 L12 28 Z" fill="none" stroke="url(#emblemGradient)" stroke-width="1.7" opacity=".9"/>
                    <path d="M56 18 L33 53 L48 53 L42 80 L69 43 L53 43 Z" fill="url(#emblemGradient)" filter="url(#emblemGlow)"/>
                    <circle cx="50" cy="50" r="43" fill="none" stroke="#7c8dff" stroke-width=".7" stroke-dasharray="2 8" opacity=".75"/>
                </svg>
                <span class="emblem-orbit orbit-one"></span>
                <span class="emblem-orbit orbit-two"></span>
            </div>

            <h1 class="brand-title"><span class="brand-springy">SPRINGY</span><span class="brand-zingy">ZINGY</span></h1>
            <p class="tagline">Avoid obstacles in a geometric world...</p>

            <div class="loader-block">
                <div class="loader-label-row">
                    <span id="loading-status">LOADING THE GAME</span>
                    <span id="loading-percent">0%</span>
                </div>
                <div class="progress-track" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-glint"></div>
                </div>
                <div class="loader-footnote"><span class="pulse-square"></span><span id="loading-detail">LOADING WORLD</span><span class="footnote-right">SZ-01</span></div>
            </div>

            <div id="loading-error" class="loading-error" hidden>
                <p>Loading failed.</p>
                <span>Check connection and try again.</span>
                <button id="retry-button" type="button">TRY AGAIN ↻</button>
            </div>
