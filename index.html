<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#08091b">
    <title>Springy Zingy</title>
    <link rel="stylesheet" href="TemplateData/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Animowane geometryczne tło widoczne podczas ładowania gry. -->
    <canvas id="network-bg" aria-hidden="true"></canvas>

    <!-- Unity przejmuje cały ekran po zakończeniu inicjalizacji. -->
    <main id="unity-container" aria-label="Springy Zingy game">
        <canvas id="unity-canvas" tabindex="-1" aria-label="Springy Zingy"></canvas>
    </main>

    <!-- Własny splash/loading screen zamiast domyślnego brandingu Unity. -->
    <section id="loading-screen" aria-live="polite" aria-label="Ładowanie gry">
        <div class="loader-shell">
            <div class="topline"><span class="topline-dot"></span> ENDLESS RUNNER <span class="topline-separator">/</span> WEB VERSION</div>

            <div class="brand-emblem" aria-hidden="true">
                <svg viewBox="0 0 100 100" role="presentation">
                    <defs>
                        <linearGradient id="emblemGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#69e8ff"/>
                            <stop offset="53%" stop-color="#9c66ff"/>
                            <stop offset="100%" stop-color="#ff4fc8"/>
                        </linearGradient>
                        <filter id="emblemGlow" x="-70%" y="-70%" width="240%" height="240%">
                            <feGaussianBlur stdDeviation="3.5" result="blur"/>
                            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <path d="M50 6 L88 28 L88 71 L50 94 L12 71 L12 28 Z" fill="none" stroke="url(#emblemGradient)" stroke-width="1.7" opacity=".9"/>
                    <path d="M56 18 L33 53 L48 53 L42 80 L69 43 L53 43 Z" fill="url(#emblemGradient)" filter="url(#emblemGlow)"/>
                    <circle cx="50" cy="50" r="43" fill="none" stroke="#7c8dff" stroke-width=".7" stroke-dasharray="2 8" opacity=".75"/>
                </svg>
                <span class="emblem-orbit orbit-one"></span>
                <span class="emblem-orbit orbit-two"></span>
            </div>

            <h1 class="brand-title"><span class="brand-springy">SPRINGY</span><span class="brand-zingy">ZINGY</span></h1>
            <p class="tagline">Avoid obstacles in a geometric world...</p>

            <div class="loader-block">
                <div class="loader-label-row">
                    <span id="loading-status">LOADING THE GAME</span>
                    <span id="loading-percent">0%</span>
                </div>
                <div class="progress-track" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-glint"></div>
                </div>
                <div class="loader-footnote"><span class="pulse-square"></span><span id="loading-detail">LOADING WORLD</span><span class="footnote-right">SZ-01</span></div>
            </div>

            <div id="loading-error" class="loading-error" hidden>
                <p>Loading failed.</p>
                <span>Check connection and try again.</span>
                <button id="retry-button" type="button">TRY AGAIN ↻</button>
            </div>

            <div class="bottomline"><span>BUILT TO BOUNCE</span><span class="bottomline-mark">✦</span><span>2.0</span></div>
        </div>
        <div class="corner-label corner-tl">SZ<span> / </span>2026</div>
        <div class="corner-label corner-br">EST. FOR THE NEXT BOUNCE</div>
    </section>

    <script src="TemplateData/loading.js"></script>
    
<script>
(function () {
    "use strict";

    // Inicjalizacja Telegram Mini App.
    var tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
        try {
            tg.expand();
            tg.ready();

            console.log("[Telegram] Mini App ready.");
            console.log("[Telegram] Platform:", tg.platform);
            console.log("[Telegram] Version:", tg.version);
        } catch (error) {
            console.warn("[Telegram] Initialization warning:", error);
        }
    } else {
        console.warn("[Telegram] WebApp API is unavailable.");
    }

    // Logowanie błędów JavaScript.
    window.addEventListener("error", function (event) {
        console.error(
            "[WebGL] JavaScript error:",
            event.message,
            event.filename,
            event.lineno
        );
    });

    window.addEventListener("unhandledrejection", function (event) {
        console.error(
            "[WebGL] Unhandled promise rejection:",
            event.reason
        );
    });

    // Unity WebGL loader.
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Web3.loader.js";

    var canvas = document.querySelector("#unity-canvas");
    var loadingScreen = document.querySelector("#loading-screen");
    var progressFill = document.querySelector("#progress-fill");
    var progressTrack = document.querySelector("#progress-track");
    var loadingPercent = document.querySelector("#loading-percent");
    var loadingStatus = document.querySelector("#loading-status");
    var loadingDetail = document.querySelector("#loading-detail");
    var loadingError = document.querySelector("#loading-error");
    var retryButton = document.querySelector("#retry-button");

    var config = {
        dataUrl: buildUrl + "/Web3.data",
        frameworkUrl: buildUrl + "/Web3.framework.js",
        codeUrl: buildUrl + "/Web3.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Springy Zingy",
        productVersion: "2.0"
    };

    function setProgress(value) {
        var percent = Math.max(
            0,
            Math.min(100, Math.round(value * 100))
        );

        progressFill.style.width = percent + "%";
        loadingPercent.textContent = percent + "%";
        progressTrack.setAttribute(
            "aria-valuenow",
            String(percent)
        );

        if (percent >= 88 && percent < 100) {
            loadingStatus.textContent = "FINALIZING DETAILS";
            loadingDetail.textContent = "ALMOST DONE";
        } else if (percent >= 45 && percent < 88) {
            loadingStatus.textContent = "LOADING WORLD";
            loadingDetail.textContent = "LOADING ASSETS";
        }
    }

    function showError(error) {
        console.error("Springy Zingy Web Player:", error);

        loadingStatus.textContent = "SOMETHING WENT WRONG";
        loadingDetail.textContent = "UNABLE TO LAUNCH THE GAME";
        loadingError.hidden = false;

        retryButton.addEventListener("click", function () {
            window.location.reload();
        }, { once: true });
    }

    // Załaduj loader Unity.
    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
        loadingStatus.textContent = "LAUNCHING ENGINE";
        loadingDetail.textContent = "MAKING WORLD";

        createUnityInstance(
            canvas,
            config,
            function (progress) {
                setProgress(Math.min(progress, 0.99));
            }
        ).then(function () {
            setProgress(1);

            loadingStatus.textContent = "SUCCESS!";
            loadingDetail.textContent = "HAVE FUN!";

            document.body.classList.add("game-ready");

            window.setTimeout(function () {
                loadingScreen.setAttribute("aria-hidden", "true");
            }, 800);

        }).catch(showError);
    };

    script.onerror = function () {
        showError(
            "Nie udało się pobrać pliku Unity loader: " + loaderUrl
        );
    };

    document.body.appendChild(script);

}());
</script>

</body>
</html>
